services:
  postgres:
    image: postgres:17-alpine
    container_name: carcare-postgres
    restart: unless-stopped
    # Compose reads these from api/.env (see .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in api/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in api/.env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - carcare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carcare-postgres-data:
